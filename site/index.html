<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VanoLib — Open Mathematics Library</title>
<meta name="description" content="Browse, read and cite open mathematics papers from arXiv in VanoLib.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="A">
  <div class="wrap">
    <aside>
      <div class="logo"><i>V</i><b>VanoLib</b></div>

      <button class="nav on" data-f="all">📚 Library <span class="n" id="nall"></span></button>
      <button class="nav" data-f="read">★ To Read <span class="n" id="nread"></span></button>
      <button class="nav" data-f="cont">◐ In Progress <span class="n" id="ncont"></span></button>

      <div class="sec">arXiv categories</div>
      <div id="category-nav" class="category-nav"></div>

      <div class="sec">Archive</div>
      <label class="nav year-nav">◷ Year
        <select id="year"><option value="">Latest</option></select>
      </label>

      <div class="side-foot">
        <span id="sync-status">Loading library…</span><br>
        Automatic sync every Monday
      </div>
    </aside>

    <div class="list">
      <div class="lh">
        <h2 id="list-title">Library</h2>
        <label class="search">⌕
          <input id="q" placeholder="Title, author, arXiv id…">
          <kbd>/</kbd>
        </label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="items" id="items"></div>
      <div id="sentinel"></div>
    </div>

    <div class="detail" id="detail">
      <div class="welcome">
        <span class="welcome-mark">V</span>
        <h1>Open mathematics, in one quiet library.</h1>
        <p>Select a paper to see its details, citation tools and integrated PDF reader.</p>
      </div>
    </div>
  </div>

  <button class="tgl" id="theme-toggle" title="Theme">☾</button>

  <div class="reader" id="reader">
    <div class="rprog" id="rprog"></div>
    <div class="rbar">
      <button id="reader-close">← Library</button>
      <span class="sep"></span>
      <button id="zoom-out">−</button>
      <button id="zoom-label" class="mono">100%</button>
      <button id="zoom-in">+</button>
      <span class="sep"></span>
      <button class="sw on" data-m="" title="Day"></button>
      <button class="sw sepia-dot" data-m="sepia" title="Sepia"></button>
      <button class="sw night-dot" data-m="night" title="Night"></button>
      <span class="sep"></span>
      <a id="reader-scholar" target="_blank" rel="noopener" title="Google Scholar">Scholar ↗</a>
      <button id="reader-star" title="To Read">☆</button>
      <a id="reader-arxiv" target="_blank" rel="noopener" title="Open on arXiv">arXiv ↗</a>
    </div>

    <div class="reader-meta" id="reader-meta"></div>
    <div class="rscroll" id="rscroll">
      <div class="pdf-shell" id="pdf-shell">
        <iframe id="pdf-frame" title="VanoLib integrated PDF reader"></iframe>
      </div>
    </div>
    <div class="rinfo" id="rinfo"></div>
  </div>

  <div class="toast" id="toast"></div>
</section>
<script src="app.js"></script>
</body>
</html>
