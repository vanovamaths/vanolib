<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VanoLib — Math Library</title>
<meta name="description" content="Math arXiv library — search, filters, and live PDF reading.">
<link rel="canonical" href="https://vanovamaths.github.io/vanolib/">
<meta property="og:type" content="website">
<meta property="og:title" content="VanoLib — Math Library">
<meta property="og:description" content="319,000+ arXiv math papers — instant search, year/category filters, and a built-in PDF reader streaming straight from arXiv. Updated every Monday.">
<meta property="og:url" content="https://vanovamaths.github.io/vanolib/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="VanoLib — Math Library">
<meta name="twitter:description" content="319,000+ arXiv math papers — instant search, year/category filters, and a built-in PDF reader streaming straight from arXiv.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23d97757%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22Helvetica%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>V</text></svg>">
</head>
<body>
<div id="topbar">
  <div class="logo-chip">V</div>
  <div class="logo-label">VanoLib</div>
  <div class="tag">Math Library</div>
  <div class="spacer"></div>
  <button id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  <a class="gh" href="https://vanovamaths.github.io/VanovaTikZSketch/" target="_blank" rel="noopener" id="gh-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
    <span>TikZSketch</span>
  </a>
</div>
<div id="loadbar"><div id="loadbar-fill"></div></div>
<div id="searchbar">
  <input type="search" id="q" placeholder="Search a title, an author…" autocomplete="off">
  <select id="year"><option value="">All years</option></select>
  <select id="cat"><option value="">All categories</option></select>
</div>
<div id="list"></div>
<div id="sentinel"></div>
<div id="empty" style="display:none;">No results.</div>
<footer id="foot"></footer>

<div id="reader">
  <div id="reader-panel">
    <div id="reader-head">
      <div class="rtitle" id="reader-title">—</div>
      <a id="reader-abs-link" href="#" target="_blank" rel="noopener">arXiv abstract ↗</a>
      <a id="reader-pdf-link" href="#" target="_blank" rel="noopener">Open in a new tab ↗</a>
      <button id="reader-close">Close ✕</button>
    </div>
    <iframe id="reader-frame" title="PDF reader"></iframe>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
