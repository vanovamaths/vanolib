name: arXiv auto-sync

# Every 6 hours: continue/finish the complete arXiv-math harvest (OAI-PMH, resumable),
# then pick up the latest papers, rebuild the search index and redeploy the site.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Re-scan the last N days"
        default: "4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vanolib-arxiv-data
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest arXiv mathematics (OAI-PMH, resumable)
        env:
          VANOLIB_BUDGET_MIN: "290"
        run: python3 scripts/harvest_math_oai.py auto --days "${{ github.event.inputs.days || '4' }}"

      - name: Newest papers and abstracts (arXiv API)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VANOLIB_LOOKBACK_DAYS: "3"
          VANOLIB_LATEST_LIMIT: "3000"
        run: python3 scripts/collect_arxiv.py

      - name: Commit and push the new data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "vanolib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data scripts
          if git diff --cached --quiet; then
            echo "No new papers."
            exit 0
          fi
          git commit -q -m "arXiv auto-sync $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            sleep 15
          done
          exit 1

  # Bot pushes don't trigger other workflows, so deploy from here.
  deploy:
    needs: harvest
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
