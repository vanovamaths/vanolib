name: Full arXiv mirror backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arxiv-backfill.yml"
      - "scripts/harvest_arxiv_oai.py"
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vanolib-arxiv-data
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh recent arXiv metadata first
        run: |
          python3 scripts/harvest_arxiv_oai.py recent \
            --lookback-days 21 \
            --max-pages 180 \
            --latest-limit 5000

      - name: Continue complete all-arXiv backfill
        run: |
          python3 scripts/harvest_arxiv_oai.py backfill \
            --max-pages 180

      - name: Validate generated mirror
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("site/data/arxiv")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))

          if manifest.get("scope") != "all arXiv":
              raise SystemExit("Unexpected arXiv mirror scope")
          if not latest:
              raise SystemExit("latest.json is empty")
          if manifest.get("total", 0) < 1:
              raise SystemExit("No mirrored records")

          print("Mirrored unique records:", manifest["total"])
          print("Backfill pages:", manifest.get("backfill_pages"))
          print("Backfill complete:", manifest.get("backfill_complete"))
          print("Newest submission:", manifest.get("latest_date"))
          PY

      - name: Commit mirror progress
        run: |
          git config user.name "vanolib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/arxiv
          if git diff --cached --quiet; then
            echo "No arXiv mirror changes."
          else
            git commit -m "Sync arXiv OAI mirror"
            git pull --rebase origin main
            git push origin main
          fi
