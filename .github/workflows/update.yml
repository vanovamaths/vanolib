name: Weekly arXiv update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte arXiv (derniers jours)
        run: python3 scripts/collect_arxiv.py
      - name: Commit et push si changements
        run: |
          git config user.name "vanolib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && echo "Rien de nouveau." || (git commit -m "Mise à jour hebdomadaire arXiv" && git push)
