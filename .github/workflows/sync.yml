name: Daily arXiv sync

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vanolib-arxiv-data
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect new arXiv mathematics papers
        env:
          VANOLIB_LOOKBACK_DAYS: "10"
          VANOLIB_LATEST_LIMIT: "3000"
        run: python3 scripts/collect_arxiv.py

      - name: Commit new data
        run: |
          git config user.name "vanolib-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No new papers."
          else
            git commit -m "Daily arXiv sync"
            git pull --rebase origin main
            git push origin main
          fi

  # Pushes made by the bot don't trigger other workflows, so deploy from here.
  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
